{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-black via-acrm-dark-navy to-black flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='images/acrm-logo.svg') }}" alt="ACRM" class="h-12 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-white mb-2">{{ institution.name }}</h1>
            <p class="text-gray-400">Select your role to continue</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-lg shadow-2xl p-8">
            <!-- Role Selection -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-700 mb-4">Who are you?</label>
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- Student Role -->
                    <label class="cursor-pointer">
                        <input 
                            type="radio" 
                            name="role" 
                            value="student" 
                            class="hidden peer"
                            checked
                        >
                        <div class="p-4 border-2 border-gray-300 rounded-lg text-center transition peer-checked:border-acrm-orange peer-checked:bg-orange-50">
                            <svg class="h-8 w-8 mx-auto mb-2 text-gray-600 peer-checked:text-acrm-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C6.5 6.253 2 10.998 2 17s4.5 10.747 10 10.747c5.5 0 10-4.998 10-10.747 0-6.002-4.5-10.747-10-10.747z"></path>
                            </svg>
                            <p class="font-semibold text-gray-800">Student</p>
                        </div>
                    </label>

                    <!-- Faculty Role -->
                    <label class="cursor-pointer">
                        <input 
                            type="radio" 
                            name="role" 
                            value="faculty" 
                            class="hidden peer"
                        >
                        <div class="p-4 border-2 border-gray-300 rounded-lg text-center transition peer-checked:border-acrm-orange peer-checked:bg-orange-50">
                            <svg class="h-8 w-8 mx-auto mb-2 text-gray-600 peer-checked:text-acrm-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <p class="font-semibold text-gray-800">Faculty</p>
                        </div>
                    </label>

                    <!-- Admin Role -->
                    <label class="cursor-pointer">
                        <input 
                            type="radio" 
                            name="role" 
                            value="admin" 
                            class="hidden peer"
                        >
                        <div class="p-4 border-2 border-gray-300 rounded-lg text-center transition peer-checked:border-acrm-orange peer-checked:bg-orange-50">
                            <svg class="h-8 w-8 mx-auto mb-2 text-gray-600 peer-checked:text-acrm-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="font-semibold text-gray-800">Admin</p>
                        </div>
                    </label>

                    <!-- Master Admin Role -->
                    <label class="cursor-pointer">
                        <input 
                            type="radio" 
                            name="role" 
                            value="master_admin" 
                            class="hidden peer"
                        >
                        <div class="p-4 border-2 border-gray-300 rounded-lg text-center transition peer-checked:border-acrm-orange peer-checked:bg-orange-50">
                            <svg class="h-8 w-8 mx-auto mb-2 text-gray-600 peer-checked:text-acrm-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                            </svg>
                            <p class="font-semibold text-gray-800">Master Admin</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-700"></p>
            </div>

            <!-- Continue Button -->
            <button 
                type="button" 
                id="continueBtn"
                class="w-full bg-acrm-orange hover:bg-orange-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2"
            >
                <span>Continue to Login</span>
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                </svg>
            </button>

            <!-- Back Link -->
            <div class="text-center mt-4">
                <a href="{{ url_for('home.login') }}" class="text-sm text-gray-600 hover:text-acrm-orange transition">
                    Back to Institution Selection
                </a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const continueBtn = document.getElementById('continueBtn');
    const roleInputs = document.querySelectorAll('input[name="role"]');

    continueBtn.addEventListener('click', function() {
        const selectedRole = document.querySelector('input[name="role"]:checked').value;
        const institutionId = '{{ institution.id }}';
        
        // Redirect to login form page
        window.location.href = `/login-form?institution_id=${institutionId}&role=${selectedRole}`;
    });
});
</script>
{% endblock %}
