<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#001F3F"/>
  
  <!-- Logo Design: A letter A with graduation cap -->
  <g transform="translate(50, 40)">
    <!-- Graduation Cap -->
    <rect x="20" y="5" width="60" height="8" fill="#FF6B35" rx="2"/>
    <polygon points="30,13 50,25 70,13" fill="#FF6B35"/>
    <circle cx="50" cy="28" r="4" fill="#FFB84D"/>
    
    <!-- Letter A -->
    <line x1="10" y1="60" x2="40" y2="20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="60" x2="40" y2="20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="45" x2="60" y2="45" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Text below -->
  <text x="100" y="180" font-size="16" font-weight="bold" fill="#FF6B35" text-anchor="middle" font-family="Arial">
    ACRM
  </text>
</svg>
